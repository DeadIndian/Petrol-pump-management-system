<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Petrosoft</title>
    <style>
        @import url('/petrosoft-assets/external/d6a15271f22498dc387964fe.css');

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('/petrosoft-assets/assets/images/Reff_code/pump_2.jpg');
            background-repeat: no-repeat;
            background-size: cover;
           
        }
        .main{
            margin: 0;
            padding: 0;
            /* background: linear-gradient(to bottom right, #FF9800, #FF5722); */
        background: linear-gradient(to bottom right, #ffdba520, #29130c20);

            /* background: linear-gradient(to bottom right, #ff980091, #ff57228a); */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            display: flex;
            /* justify-content: center;
            align-items: center; */
            align-items: flex-start; /* aligns child elements to the left */
            justify-content: flex-start; /* aligns content to the top */
            height: 100%;
            flex-direction: column;
        }

        .card {
            width: 320px;
            height: 300px;
            padding: 40px;
            /* backdrop-filter: blur(10px); */
            /* box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2); */
            /* box-shadow: 0 16px 24px 2px rgba(0, 0, 0, 0.14), 0 6px 30px 5px rgba(0, 0, 0, 0.12), 0 8px 10px -5px rgba(0, 0, 0, 0.4); */
            box-shadow: 0 16px 24px 2px rgba(0, 0, 0, 0.14), 0 6px 30px 5px rgba(0, 0, 0, 0.12), 0 8px 10px -5px rgba(0, 0, 0, 0.4);
            border-radius: 6px;
            padding-bottom: 20px;
            -webkit-transform: translate3d(0, 0, 0);
            -moz-transform: translate3d(0, 0, 0);
            -o-transform: translate3d(0, 0, 0);
            -ms-transform: translate3d(0, 0, 0);
            transform: translate3d(0, 0, 0);
            -webkit-transition: all 300ms linear;
            -moz-transition: all 300ms linear;
            -o-transition: all 300ms linear;
            -ms-transition: all 300ms linear;
            transition: all 300ms linear;
            position: relative;
            margin: 25px 0;
            color: rgba(0, 0, 0, 0.87);
            background: #ffffff59;

        }

        html * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* .logobox {
            background: linear-gradient(60deg, #ab47bc, #f84765);
            background: linear-gradient(60deg, #f56639, #FF5722);
            background: linear-gradient(60deg, #607D8B, #607D8B);
            box-shadow: 0 4px 20px 0px rgba(0, 0, 0, 0.14), 0 7px 10px -5px rgb(16 16 16 / 40%);
            margin-top: -75px;
            margin-bottom: 20px;
            border-radius: 3px;
            padding: 15px;
            position: relative;
            z-index: 3;
            text-align: center;
        } */

        .logobox {
                background: linear-gradient(135deg, #607D8B, #455A64);
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
                border-radius: 12px;
                padding: 20px 30px;
                margin-top: -80px;
                margin-bottom: 25px;
                position: relative;
                z-index: 3;
                text-align: center;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.3s ease-in-out;
        }

        .logobox:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        img.petrologo {
            width: 180px;
            height: auto;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
        }




        /* img.petrologo {
            width: 190px;
            height: auto;
        } */

        h2 {
            color: #000000de;
            text-align: center;
            margin-bottom: 20px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        label {
            color: #000000de;
            margin-bottom: 5px;
            text-align: center;
        }

        /* input {
            padding: 10px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.8);
        } */

        input#refcode {
            border: 0;
            background-image: linear-gradient(#D2D2D2, #D2D2D2);
            background-size: 0 2px, 100% 1px;
            background-repeat: no-repeat;
            background-position: center bottom, center calc(100% - 1px);
            background-color: rgba(0, 0, 0, 0);
            float: none;
            box-shadow: none;
            border-radius: 0;
            font-weight: 400;
            height: 36px;
            padding: 7px 10px;
            font-size: 14px;
            line-height: 1.428571429;
            position: relative;
            z-index: 2;
            max-width: 100%;
            margin: auto;
            width: 210px;
            background: #f3f3f3;
            text-align: center;
        }

        button.btn-submit {
            border: 1px solid #607d8b;
            border-radius: 25px;
            cursor: pointer;
            max-width: 180px;
            margin: 10px auto;
            width: 100%;
            padding: 11px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            background: #ffffff;
            color: #2f5669;
            letter-spacing: 2px;
        }

        button.btn-submit:hover {
            color: #ebebeb;
            transition: 0.5s all;
            border: 1px solid #607d8b;
            background: #262525;
            background: #607d8b;
        }

        @media (max-width: 480px) {
            .card {
                width: 100%;
                max-width: 350px;
            }
        }


        .custom-alert {
        background-color: #ffdddd; /* Light red background */
        border-left: 6px solid #f44336; /* Red border */
        color: #a94442; /* Dark red text */
        padding: 15px 20px;
        border-radius: 4px;
        margin-bottom: 20px;
        position: relative;
        font-family: Arial, sans-serif;
        width: 275px;
         margin: 20px auto;
    }

    .custom-alert.success {
        background-color: #ddffdd; /* Light green background */
        border-left: 6px solid #4CAF50; /* Green border */
        color: #3c763d; /* Dark green text */
    }

    .custom-alert.warning {
        background-color: #fff3cd; /* Light yellow background */
        border-left: 6px solid #ff9800; /* Orange border */
        color: #856404; /* Dark yellow text */
    }

    .custom-alert.info {
        background-color: #d9edf7; /* Light blue background */
        border-left: 6px solid #17a2b8; /* Blue border */
        color: #31708f; /* Dark blue text */
    }

    .custom-alert strong {
        font-weight: bold;
    }

    .custom-alert .close-btn {
        position: absolute;
        top: 10px;
        right: 20px;
        background: none;
        border: none;
        font-size: 18px;
        color: #a94442; /* Dark red */
        cursor: pointer;
    }

    .custom-alert.success .close-btn {
        color: #3c763d; /* Dark green */
    }

    .custom-alert.warning .close-btn {
        color: #856404; /* Dark yellow */
    }

    .custom-alert.info .close-btn {
        color: #31708f; /* Dark blue */
    }
    </style>
<link href="/petrosoft-assets/runtime.css" rel="stylesheet"/></head>

<body><script id="ps-context" type="application/json">__PS_CONTEXT__</script>
    <div class="main">
        <div class="container">
            <!-- Example for Error Alert -->
            
            <div class="card msncard">
                <div class="logobox">
                    <img alt="petrosoft logo" class="petrologo" src="/petrosoft-assets/assets/images/Reff_code/petrosoftLogo-white-new.png" title="petrolbunk management software"/>
                </div>
                <!-- <h2>Welcome Again</h2> -->
                <form action="/api/petrosoft/auth" data-ps-auth="station" method="POST">
                    <label for="refcode">Welcome Again</label>
                    <input id="refcode" name="reff_code" placeholder="Enter Reference Code" style="" type="text"/>
                    <button class="btn-submit" type="submit">Submit</button>
                </form>
            </div>
        </div>
    </div>


<script src="/petrosoft-assets/runtime.js"></script></body></html>
